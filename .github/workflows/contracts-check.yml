# Static contract checks on every push. Cheap, no model, no secrets.
name: Contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Workflow and ignore-file assertions
        timeout-minutes: 2   # a regex regression once hung this rather than failing it
        run: python3 scripts/check-workflow.py
      - name: Committed compile state validates (when present)
        run: |
          if [ -f .compile-state.json ]; then python3 scripts/validate-compile-state.py .compile-state.json; else echo "no .compile-state.json yet"; fi
      - name: Committed claims index is well-formed (when present)
        run: |
          if [ -f .claims-index.json ]; then jq -e '.schema_version == 1 and (.claims | length) > 0 and (.sidecar_fingerprint | length) == 64' .claims-index.json >/dev/null; else echo "no .claims-index.json yet"; fi
