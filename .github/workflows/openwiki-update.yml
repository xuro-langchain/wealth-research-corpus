# The refresh workflow — phase 04 of the poc specs, contracts C4, C5, C6, C9, C11.
#
# A source document changed; recompile the wiki. No agent anywhere in here:
# compiling is procedural, and routing it through a model would add
# nondeterminism, latency, and a failure mode where the compile silently does
# not happen.
name: OpenWiki Refresh

on:
  push:
    branches: [main]
    # ONLY the source directories. This is the loop-breaker, and it is
    # structural rather than a guard inside the job: this workflow commits to
    # openwiki/**, so a trigger firing on any push would re-trigger itself on
    # its own output, forever. A paths filter makes that unrepresentable.
    paths:
      - 'internal_research/**'
      - 'external_sources/**'
      - 'internal_guidelines/**'
  workflow_dispatch:        # manual, and the ingest API's explicit dispatch (C6)
    inputs:
      mode:
        description: "Compile mode: deep (terra/high), normal (terra/medium), fast (gpt-5.4-mini/low). Ignored if the head commit carries a Compile-Mode trailer."
        type: choice
        options: [deep, normal, fast]
        default: normal
  schedule:
    - cron: '17 7 * * *'    # the reconciler — see the job comment

# C6 layer 1. GitHub holds one pending run per group and a third dispatch
# replaces the pending one; that is correct, not lossy, because `openwiki
# --update` compiles whatever is at HEAD. Cancelling the IN-PROGRESS run would
# be lossy (OpenWiki merges pages as it finishes them), hence false.
concurrency:
  group: openwiki-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write     # an interrupted compile re-dispatches itself to resume

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The BRANCH, not github.sha. A run that waited in the concurrency
          # queue would otherwise check out the commit frozen at event time and
          # recompile a tree that is already compiled: observed live — the
          # dispatch queued behind the push run compiled 2736ad8 a second time
          # (107 model calls), then its push was rejected because main had
          # moved. Checking out the branch resolves at job start, so the queued
          # run sees the new head, OpenWiki's no-op check skips, and C6's
          # "the run that lands sees every document" becomes true.
          ref: main
          # Full history. A shallow clone hides the commit OpenWiki last
          # documented, and the update then runs against an empty change
          # summary — it recompiles nothing and reports success.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install OpenWiki
        run: npm install --global openwiki@0.5.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Record the previous compile
        id: prev
        run: |
          prev=$(jq -r '.compiled_from // empty' .compile-state.json 2>/dev/null || true)
          echo "compiled_from=$prev" >> "$GITHUB_OUTPUT"

      # C4: the delta is set arithmetic over sidecar claim ids captured BEFORE
      # the run. Nothing in this workflow parses OpenWiki's stdout.
      - name: Record claim ids before
        run: ./scripts/claim-diff.sh snapshot /tmp/claims-before.txt

      # The compile mode rides on the COMMIT, not the dispatch. The push run fires
      # the instant the ingest lands and is the one that compiles; the explicit
      # dispatch queues behind it and no-ops (C6). A dispatch input therefore
      # cannot carry the mode — a `Compile-Mode:` trailer on the head commit can,
      # and it also means the choice is recorded in git history.
      - name: Resolve compile mode
        id: mode
        run: |
          # The trailer rides on the INGEST commit. A refresh commit can land on
          # top of it before this run checks out (a queued run saw exactly
          # that), so read every commit since the last compile, newest first.
          prev='${{ steps.prev.outputs.compiled_from }}'
          range="HEAD"; if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then range="$prev..HEAD"; fi
          mode=$(git log $range --format=%B | sed -n 's/^Compile-Mode:[[:space:]]*//p' | head -1 | tr 'A-Z' 'a-z')
          mode=${mode:-${{ github.event.inputs.mode || vars.OPENWIKI_COMPILE_MODE || 'normal' }}}
          case "$mode" in
            deep)   model='gpt-5.6-terra'; effort='high' ;;
            # Fast is terra at LOW effort, not gpt-5.4-mini. Mini planned 20 of
            # 29 pages for a 23-line net-new endorsement and two of its workers
            # exited without submitting (an interrupted run); terra planned the
            # 3 pages the document actually touches. Planning quality decides
            # the wall time here, not per-call latency. (Mini also takes no
            # effort setting — an empty effort means "do not set the variable".)
            fast)   model='gpt-5.6-terra'; effort='low'  ;;
            *)      mode='normal'; model='gpt-5.6-terra'; effort='medium' ;;
          esac
          echo "mode=$mode"     >> "$GITHUB_OUTPUT"
          echo "model=$model"   >> "$GITHUB_OUTPUT"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "compile mode: $mode → $model @ ${effort:-model default}"

      - name: Run OpenWiki
        id: openwiki
        # An interrupted run has merged some pages and skipped others. That
        # output is progress and is committed; the next run treats it as the
        # baseline. Only this step tolerates failure — a state file that
        # disagrees with the tree must never be.
        continue-on-error: true
        # OPENWIKI_REASONING_EFFORT must be ABSENT, not empty, when the mode
        # has no effort: OpenWiki validates any set value against its list.
        run: |
          if [ -n "${OW_EFFORT}" ]; then export OPENWIKI_REASONING_EFFORT="${OW_EFFORT}"; fi
          openwiki code --update --print
        env:
          OW_EFFORT: ${{ steps.mode.outputs.effort }}
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The model key is routed through the LangSmith gateway, exactly as
          # the local runs that compiled this wiki were. Without the base URL a
          # gateway key hits api.openai.com and fails.
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENWIKI_MODEL_ID: ${{ steps.mode.outputs.model }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: 'true'

      - name: Remove transient run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Record claim ids after
        if: ${{ !cancelled() }}
        run: ./scripts/claim-diff.sh snapshot /tmp/claims-after.txt

      # The compile honours the page-type vocabulary only partially (10 of 18
      # pages came back `type: "Reference"` on the first clean run), and the
      # agent reads `type` to decide what authority a page carries. Type is
      # derivable from the wiki path, so derive it. Runs BEFORE the index, which
      # is built from the pages.
      - name: Normalise page types
        if: ${{ !cancelled() }}
        run: python3 scripts/normalise-page-types.py

      # C11. Imports the vendored phase 02 index code; never a reimplementation.
      - name: Build the claims index
        if: ${{ !cancelled() }}
        run: python3 scripts/build-claims-index.py

      # C4. Asserts compiled_from == .last-update.json gitHead, validates the
      # schema, and exits non-zero on either — so an invalid file is never pushed.
      - name: Write and validate the compile state
        id: state
        if: ${{ !cancelled() }}
        run: >
          ./scripts/claim-diff.sh write-state /tmp/claims-before.txt /tmp/claims-after.txt
          "${{ steps.openwiki.outcome }}"
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "${{ github.run_attempt }}"
          "${{ steps.prev.outputs.compiled_from }}"
          "${{ steps.mode.outputs.mode }}"

      # Only when the state file was written and validated: a tree pushed under
      # a state file that disagrees with it is the one thing C4 forbids.
      - name: Commit the compiled output
        id: commit
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        run: |
          git config user.name  'openwiki-refresh[bot]'
          git config user.email 'openwiki-refresh@users.noreply.github.com'
          git add openwiki .compile-state.json .claims-index.json
          ./scripts/assert-write-domain.sh
          if git diff --cached --quiet; then
            echo "nothing to commit: the wiki is already current"
            echo "landed=unchanged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "docs: refresh OpenWiki ($(jq -r .status .compile-state.json))" \
                     -m "compiled_from $(jq -r .compiled_from .compile-state.json)" \
                     -m "$(jq -c .claims .compile-state.json 2>/dev/null || echo 'claims: n/a')"
          # The push can lose a race with a commit that landed while OpenWiki
          # ran. Which commit decides what to do:
          #   a SOURCE change (internal_research/external_sources/internal_guidelines) — this compile is
          #     stale; stop, and let the run that push triggered recompile.
          #     Not a failure: nothing was lost and nothing is wrong.
          #   anything else (scripts, workflow, a vendor sync) — the compile is
          #     still true of the sources; replay our commit on top and push.
          for attempt in 1 2 3; do
            if git push; then echo "landed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch --quiet origin main
            if [ -n "$(git diff --name-only HEAD origin/main -- internal_research external_sources internal_guidelines)" ]; then
              echo "superseded: a newer push changed source documents; the run it triggered recompiles. Not pushing a stale compile."
              echo "landed=superseded" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push rejected by a non-source commit; replaying on top (attempt $attempt)"
            git rebase --quiet origin/main || { git rebase --abort; break; }
          done
          echo "landed=false" >> "$GITHUB_OUTPUT"
          echo "could not land the compiled output after 3 attempts" >&2
          exit 1

      # An interrupted run has committed its progress; nothing else re-triggers
      # it (the push trigger ignores openwiki/**), so dispatch the resume here.
      # Bounded: three interrupted compiles in a row means something is wrong
      # with the run, not the schedule.
      - name: Resume an interrupted compile
        if: ${{ !cancelled() && steps.state.outcome == 'success' && steps.commit.outcome == 'success' && steps.commit.outputs.landed != 'superseded' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(jq -r .status .compile-state.json)
          [ "$status" = "interrupted" ] || { echo "compile $status; nothing to resume"; exit 0; }
          streak=$(git log -3 --format=%s -- .compile-state.json | grep -c '(interrupted)' || true)
          if [ "$streak" -ge 3 ]; then echo "three interrupted compiles in a row; not re-dispatching" >&2; exit 0; fi
          echo "re-dispatching to resume (interrupted streak $streak, mode ${{ steps.mode.outputs.mode }})"
          gh workflow run openwiki-update.yml --ref main -f mode='${{ steps.mode.outputs.mode }}'

      # C9. Fires on every terminal status. `|| true` because the callback is an
      # optimization — .compile-state.json in git is the mechanism.
      - name: Callback
        if: ${{ always() && !cancelled() }}
        run: ./scripts/callback.sh || true
        env:
          REFRESH_CALLBACK_URL: ${{ secrets.REFRESH_CALLBACK_URL }}
          REFRESH_CALLBACK_SECRET: ${{ secrets.REFRESH_CALLBACK_SECRET }}
          # A compile whose commit did not land is a FAILED refresh, whatever
          # OpenWiki's own status says. Observed: a rejected push followed by a
          # callback reporting "complete" for output nobody can read.
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          # true | unchanged | superseded | false. Superseded is reported as
          # such, not as failed: the run the newer push triggered recompiles.
          COMMIT_LANDED: ${{ steps.commit.outputs.landed }}

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
